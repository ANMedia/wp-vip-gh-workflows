name: Release

on:
  workflow_call:
    inputs:
      commit_changelog:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # contents: write covers everything this job does: pushing the tag, creating the release,
    # committing CHANGELOG.md to preprod and pushing to the wiki repo (wiki access follows contents).
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
        with:
          fetch-depth: 0

      # Create git tag from timestamp YYYY-MM-DDTHH:MM:SS
      - name: Get current date and time
        id: datetime
        run: echo "TAG_NAME=$(date +'%Y-%m-%dT%H.%M.%S')" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        uses: rickstaa/action-create-tag@a1c7777fcb2fee4f19b0f283ba888afa11678b72 # v1.7.2
        with:
          tag: ${{ steps.datetime.outputs.TAG_NAME }}
          message: "Release ${{ steps.datetime.outputs.TAG_NAME }}"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_push_tag: false

      - name: Get latest tag
        id: get_latest_tag
        run: |
          LATEST_TAG=$(git for-each-ref --sort=-taggerdate --format '%(refname:short)' refs/tags | sed -n 1p)
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Get second latest tag
        id: get_second_latest_tag
        run: |
          SECOND_LATEST_TAG=$(git for-each-ref --sort=-taggerdate --format '%(refname:short)' refs/tags | sed -n 2p)
          echo "second_latest_tag=$SECOND_LATEST_TAG" >> "$GITHUB_OUTPUT"

      # This changes the ownership of files in the GITHUB_WORKSPACE to the current runner's user to prevent a changelog write error
      - name: Change file ownership
        run: sudo chown -R $(whoami):$(whoami) .

      - name: Generate a changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: create-changelog
        with:
          args: ${{ steps.get_second_latest_tag.outputs.second_latest_tag }}..${{ steps.get_latest_tag.outputs.latest_tag }} --prepend='CHANGELOG.md' --output='/tmp/CHANGELOG.md' --config-url='https://github.com/ANMedia/wp-vip-gh-workflows/blob/main/.github/workflows/cliff.toml?raw=true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Create Release
        uses: ncipollo/release-action@a2e71bdd4e7dab70ca26a852f29600c98b33153e # v1.12.0
        with:
          allowUpdates: true
          draft: false
          makeLatest: true
          name: ${{ steps.get_latest_tag.outputs.latest_tag }}
          body: ${{ steps.create-changelog.outputs.content }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.get_latest_tag.outputs.latest_tag }}

      - name: Commit CHANGELOG.md
        if: ${{ inputs.commit_changelog }}
        uses: stefanzweifel/git-auto-commit-action@3ea6ae190baf489ba007f7c92608f33ce20ef04a # v4.16.0
        with:
          branch: preprod
          commit_options: "--no-verify"
          push_options: "--force"
          commit_message: "docs: update CHANGELOG.md for ${{ steps.get_latest_tag.outputs.latest_tag }} [skip ci]"
          file_pattern: CHANGELOG.md

      - name: Update Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git $(basename ${{ github.repository }}).wiki; then
            cd $(basename ${{ github.repository }}).wiki
            git config user.name "GitHub Actions"
            git config user.email "dmg-github@dmgmedia.co.uk"
            echo -e "${{ steps.create-changelog.outputs.content }}$(cat Changelog.md)" > Changelog.md
            git add .
            git commit -m "Updated Changelog.md"
            git push
          fi
