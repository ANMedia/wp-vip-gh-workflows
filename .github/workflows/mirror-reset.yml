name: Mirror Reset

on:
  workflow_call:
    inputs:
      mirror_repository:
        required: true
        type: string
    secrets:
      WPCOMVIP_MIRROR_TOKEN:
        required: true

concurrency:
  group: mirror-reset-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    if: >-
      github.repository_owner == 'dmg-wp-sites' && github.ref_type == 'branch' &&
      (github.ref_name == 'production' || github.ref_name == 'develop' ||
       github.ref_name == 'test1' || github.ref_name == 'test2' ||
       github.ref_name == 'test3' || github.ref_name == 'test4' ||
       github.ref_name == 'test5')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Push reset branches to wpcomvip mirror
        env:
          MIRROR_TOKEN: ${{ secrets.WPCOMVIP_MIRROR_TOKEN }}
          MIRROR_REPOSITORY: ${{ inputs.mirror_repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch="not selected"
          source_sha="not captured"
          trap 'status=$?; if (( status != 0 )); then echo "::error::PARTIAL SYNC: reset has already run; mirroring failed for ${branch} (${source_sha}). Inspect both repositories before retrying." >&2; fi' EXIT
          case "${GITHUB_REF_NAME}" in
            production) branches=(test1 test2 test3 test4 test5 develop) ;;
            develop|test[1-5]) branches=("${GITHUB_REF_NAME}") ;;
            *) echo "No reset branches to mirror."; exit 0 ;;
          esac
          if [[ ! "${MIRROR_REPOSITORY}" =~ ^wpcomvip/[A-Za-z0-9._-]+$ || -z "${MIRROR_TOKEN}" ]]; then
            echo "::error::A wpcomvip/repository mirror and WPCOMVIP_MIRROR_TOKEN are required."
            exit 1
          fi
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git remote add mirror \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPOSITORY}.git"

          production_sha="$(git rev-parse refs/remotes/origin/production)"
          for branch in "${branches[@]}"; do
            ref="refs/heads/${branch}"
            if ! git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
              if [[ "${GITHUB_REF_NAME}" == production ]]; then
                echo "Skipped ${branch}: source branch does not exist."
                continue
              fi
              echo "::error::Source branch ${branch} does not exist."
              exit 1
            fi
            source_sha="$(git rev-parse "refs/remotes/origin/${branch}")"
            if [[ "$(git rev-parse "${source_sha}^")" != "${production_sha}" ||
                  "$(git log -1 --format=%s "${source_sha}")" != "[skip ci] ${branch} - [skip ci] git reset --hard origin/production" ]]; then
              echo "::error::${branch} is not the expected reset commit on production."
              exit 1
            fi
            expected_sha="$(git -c http.https://github.com/.extraheader= ls-remote --refs mirror "${ref}" | awk '{print $1}')"
            source_now="$(git ls-remote --refs origin "${ref}" | awk '{print $1}')"
            if [[ "${source_now}" != "${source_sha}" ]]; then
              echo "::error::${branch} moved in source; mirror push stopped."
              false
            fi
            git -c http.https://github.com/.extraheader= push --force-with-lease="${ref}:${expected_sha}" mirror "${source_sha}:${ref}"
            source_now="$(git ls-remote --refs origin "${ref}" | awk '{print $1}')"
            mirror_now="$(git -c http.https://github.com/.extraheader= ls-remote --refs mirror "${ref}" | awk '{print $1}')"
            if [[ "${source_now}" != "${source_sha}" || "${mirror_now}" != "${source_sha}" ]]; then
              echo "::error::${branch} no longer points to ${source_sha} in both repositories."
              false
            fi
            echo "Mirrored ${branch}: ${source_sha}"
          done
