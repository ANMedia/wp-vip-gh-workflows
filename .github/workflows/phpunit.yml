name: PHPUnit

on:
  workflow_call:
    inputs:
      commit_coverage:
        required: false
        type: boolean
        default: false
    secrets:
      COMPOSER_AUTH:
        required: true

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-24.04
    env:
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{secrets.COMPOSER_AUTH}}"} }' # [tl! **
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Refresh apt package lists
        run: |
          sudo apt-get update
          sudo apt-get check
      - name: Install Subversion
        run: sudo apt-get install -y subversion
      - name: Configure PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, mysqli, pdo_mysql, bcmath, soap, intl, gd, exif, iconv, imagick, :sqlsrv, :pdo_sqlsrv
          coverage: xdebug
      - name: Fail on PHP startup warnings
        run: |
          if php -r '' 2>&1 | grep -q 'PHP Startup'; then
            php -r '' 2>&1
            exit 1
          fi
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader --ignore-platform-req=php
      - name: PHPUnit
        run: |
          composer run phpunit
      - name: Commit coverage report
        if: ${{ inputs.commit_coverage }}
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "$( git log --format=%cn -n 1 ${{github.sha}} )"
          git config user.email "$( git log --format=%ce -n 1 ${{github.sha}} )"
          git fetch origin  
          git checkout "$HEAD_REF"
          ls -al ./tests/phpunit
          git status
          git add --force ./tests/phpunit/coverage
          git commit -m "Add PHPUnit coverage report" 
          git push --force origin "$HEAD_REF"
