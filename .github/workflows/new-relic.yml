name: New Relic Deployment Marker

# Sets deployment markers in New Relic when code is deployed to various environments.
# Triggered on production, preprod, develop, and test branches, using branch-specific entity GUIDs
# to track deployments. For production, it also retrieves the latest tag for version tracking.
# Requires New Relic API key and entity GUIDs to be stored as GitHub secrets.

on:
  workflow_call:
    secrets:
      NEW_RELIC_API_KEY:
        required: true
      NEW_RELIC_DEPLOYMENT_ENTITY_GUID:
        required: true
      NEW_RELIC_TEST1_ENTITY_GUID:
        required: false
      NEW_RELIC_TEST2_ENTITY_GUID:
        required: false
      NEW_RELIC_TEST3_ENTITY_GUID:
        required: false
      NEW_RELIC_TEST4_ENTITY_GUID:
        required: false
      NEW_RELIC_TEST5_ENTITY_GUID:
        required: false
      NEW_RELIC_DEVELOP_ENTITY_GUID:
        required: false
      NEW_RELIC_PREPROD_ENTITY_GUID:
        required: false

permissions: read-all

jobs:
  new-relic-marker:
    name: Set Deployment Marker
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'production' || github.ref_name == 'preprod' || github.ref_name == 'develop' || github.ref_name == 'test1' || github.ref_name == 'test2' || github.ref_name == 'test3' || github.ref_name == 'test4' || github.ref_name == 'test5' }}
    steps:
      - name: Checkout code
        if: ${{ github.ref_name == 'production' }}
        uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
        with:
          fetch-depth: 0

      # Get latest tag for version info on production releases.
      - name: Get latest tag
        id: get_latest_tag
        if: ${{ github.ref_name == 'production' }}
        uses: actions-ecosystem/action-get-latest-tag@b7c32daec3395a9616f88548363a42652b22d435 # v1.6.0
        with:
          semver_only: false

      # Determine the variables to use for the newrelic-marker step.
      - name: Set New Relic Entity GUID by branch
        id: set-guid
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Using branch: $BRANCH_NAME"

          # Handle production branch specially
          if [ "$BRANCH_NAME" == "production" ]; then
            {
              echo "ENTITY_GUID=${{ secrets.NEW_RELIC_DEPLOYMENT_ENTITY_GUID }}"
              echo "DESCRIPTION=Automated Release via Github Actions"
              echo "VERSION=${{ steps.get_latest_tag.outputs.tag }}"
            } >> "$GITHUB_OUTPUT"
          else
            # For other branches, construct name of GUID secret
            SECRET_NAME="NEW_RELIC_$(echo "$BRANCH_NAME" | tr '[:lower:]' '[:upper:]')_ENTITY_GUID"
            echo "Looking for secret: $SECRET_NAME"

            # Get the secret value by name
            case "$BRANCH_NAME" in
              "test1")
                ENTITY_GUID="${{ secrets.NEW_RELIC_TEST1_ENTITY_GUID }}"
                ;;
              "test2")
                ENTITY_GUID="${{ secrets.NEW_RELIC_TEST2_ENTITY_GUID }}"
                ;;
              "test3")
                ENTITY_GUID="${{ secrets.NEW_RELIC_TEST3_ENTITY_GUID }}"
                ;;
              "test4")
                ENTITY_GUID="${{ secrets.NEW_RELIC_TEST4_ENTITY_GUID }}"
                ;;
              "test5")
                ENTITY_GUID="${{ secrets.NEW_RELIC_TEST5_ENTITY_GUID }}"
                ;;
              "develop")
                ENTITY_GUID="${{ secrets.NEW_RELIC_DEVELOP_ENTITY_GUID }}"
                ;;
              "preprod")
                ENTITY_GUID="${{ secrets.NEW_RELIC_PREPROD_ENTITY_GUID }}"
                ;;
              *)
                echo "No entity GUID configured for branch $BRANCH_NAME, skipping marker"
                echo "SKIP_MARKER=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac

            if [ -n "$ENTITY_GUID" ] && [ "$ENTITY_GUID" != "" ]; then
              {
                echo "ENTITY_GUID=$ENTITY_GUID"
                echo "DESCRIPTION=Automated deployment via Github Actions - metro-$BRANCH_NAME"
                echo "VERSION=${{ github.sha }}"
              } >> "$GITHUB_OUTPUT"
            else
              echo "$SECRET_NAME not available, skipping marker"
              echo "SKIP_MARKER=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Get current timestamp in milliseconds for deployment marker
        id: timestamp
        if: ${{ steps.set-guid.outputs.SKIP_MARKER != 'true' }}
        run: echo "NOW_MS=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

      - name: Set New Relic deployment marker
        id: newrelic-marker
        if: ${{ steps.set-guid.outputs.SKIP_MARKER != 'true' }}
        uses: newrelic/deployment-marker-action@b0c0863151aae3c51c37a5a4a7e26a6c92cd5b91 # v2.6.1
        with:
          apiKey: ${{ secrets.NEW_RELIC_API_KEY }}
          region: "US"
          guid: ${{ steps.set-guid.outputs.ENTITY_GUID }}
          version: ${{ steps.set-guid.outputs.VERSION }}
          changelog: "https://github.com/${{ github.repository }}/blob/preprod/CHANGELOG.md"
          description: ${{ steps.set-guid.outputs.DESCRIPTION }}
          user: ${{ github.actor }}
          timestamp: ${{ steps.timestamp.outputs.NOW_MS }}
