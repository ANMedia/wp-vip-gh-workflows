name: PHPUnit (wp-env)

on:
  workflow_call:
    inputs:
      commit_coverage:
        required: false
        type: boolean
        default: false
    secrets:
      COMPOSER_AUTH:
        required: true

jobs:
  phpunit:
    name: PHPUnit (wp-env)
    runs-on: ubuntu-latest
    env:
      COMPOSER_AUTH: ${{secrets.COMPOSER_AUTH}}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, mysqli, pdo_mysql, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: xdebug

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm clean-install

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader --ignore-platform-req=php

      - name: Start wp-env
        if: ${{ !inputs.commit_coverage }}
        run: npm run test:php:setup

      - name: Start wp-env (with Xdebug)
        if: ${{ inputs.commit_coverage }}
        run: npm run test:php:setup:debug

      - name: Docker debug information
        run: docker ps -a

      - name: Run PHPUnit
        if: ${{ !inputs.commit_coverage }}
        run: npm run test:php:base

      - name: Run PHPUnit with coverage
        if: ${{ inputs.commit_coverage }}
        run: npm run test:php:coverage:base

      - name: Stop wp-env
        if: always()
        run: npm run test:php:teardown

      - name: Commit coverage report
        if: ${{ inputs.commit_coverage }}
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "$( git log --format=%cn -n 1 ${{github.sha}} )"
          git config user.email "$( git log --format=%ce -n 1 ${{github.sha}} )"
          git fetch origin  
          git checkout "$HEAD_REF"
          ls -al ./tests/phpunit
          git status
          git add --force ./tests/phpunit/coverage
          git commit -m "Add PHPUnit coverage report" 
          git push --force origin "$HEAD_REF"
