name: Mirror Source

on:
  workflow_call:
    inputs:
      mirror_repository:
        required: true
        type: string
    secrets:
      WPCOMVIP_MIRROR_TOKEN:
        required: true

concurrency:
  group: mirror-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository_owner == 'ANMedia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push branch to wpcomvip mirror
        env:
          FORCE_PUSH: ${{ github.event.forced || false }}
          MIRROR_TOKEN: ${{ secrets.WPCOMVIP_MIRROR_TOKEN }}
          MIRROR_REPOSITORY: ${{ inputs.mirror_repository }}
        run: |
          [[ "${MIRROR_REPOSITORY}" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]
          git check-ref-format "${GITHUB_REF}"
          git remote add mirror \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPOSITORY}.git"

          if [[ "${FORCE_PUSH}" == "true" && "${GITHUB_REF}" != "refs/heads/develop" && "${GITHUB_REF}" != "refs/heads/preprod" && "${GITHUB_REF}" != "refs/heads/production" ]]; then
            EXPECTED_REMOTE_SHA="$(git ls-remote mirror "${GITHUB_REF}" | awk '{print $1}')"
          fi

          if [[ -n "${EXPECTED_REMOTE_SHA:-}" ]]; then
            git push --force-with-lease="${GITHUB_REF}:${EXPECTED_REMOTE_SHA}" mirror "HEAD:${GITHUB_REF}"
          else
            git push mirror "HEAD:${GITHUB_REF}"
          fi

          git ls-remote --exit-code mirror "${GITHUB_REF}"
