name: New Relic Built Deployment Marker

# Creates New Relic markers for -built branches using their commit SHA; Links the source commit
on:
  workflow_call:
    secrets:
      NEW_RELIC_API_KEY:
        required: true
      NEW_RELIC_DEPLOYMENT_ENTITY_GUID:
        required: true
      NEW_RELIC_TEST1_ENTITY_GUID:
        required: false
      NEW_RELIC_TEST2_ENTITY_GUID:
        required: false
      NEW_RELIC_TEST3_ENTITY_GUID:
        required: false
      NEW_RELIC_TEST4_ENTITY_GUID:
        required: false
      NEW_RELIC_TEST5_ENTITY_GUID:
        required: false
      NEW_RELIC_DEVELOP_ENTITY_GUID:
        required: false
      NEW_RELIC_PREPROD_ENTITY_GUID:
        required: false

permissions:
  contents: read

jobs:
  new-relic-marker:
    name: Set Deployment Marker
    runs-on: ubuntu-latest
    if: endsWith(github.ref_name, '-built')
    steps:
      - name: Set New Relic Entity GUID by branch
        id: set-guid
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
          PRODUCTION_GUID: ${{ secrets.NEW_RELIC_DEPLOYMENT_ENTITY_GUID }}
          TEST1_GUID: ${{ secrets.NEW_RELIC_TEST1_ENTITY_GUID }}
          TEST2_GUID: ${{ secrets.NEW_RELIC_TEST2_ENTITY_GUID }}
          TEST3_GUID: ${{ secrets.NEW_RELIC_TEST3_ENTITY_GUID }}
          TEST4_GUID: ${{ secrets.NEW_RELIC_TEST4_ENTITY_GUID }}
          TEST5_GUID: ${{ secrets.NEW_RELIC_TEST5_ENTITY_GUID }}
          DEVELOP_GUID: ${{ secrets.NEW_RELIC_DEVELOP_ENTITY_GUID }}
          PREPROD_GUID: ${{ secrets.NEW_RELIC_PREPROD_ENTITY_GUID }}
        run: |
          ENVIRONMENT="${BRANCH_NAME%-built}"
          VERSION="$COMMIT_SHA"
          DESCRIPTION="Automated deployment via Github Actions - $REPOSITORY_NAME-$ENVIRONMENT"

          case "$ENVIRONMENT" in
            production)
              ENTITY_GUID="$PRODUCTION_GUID"
              DESCRIPTION="Automated Release via Github Actions"
              ;;
            test1) ENTITY_GUID="$TEST1_GUID" ;;
            test2) ENTITY_GUID="$TEST2_GUID" ;;
            test3) ENTITY_GUID="$TEST3_GUID" ;;
            test4) ENTITY_GUID="$TEST4_GUID" ;;
            test5) ENTITY_GUID="$TEST5_GUID" ;;
            develop) ENTITY_GUID="$DEVELOP_GUID" ;;
            preprod) ENTITY_GUID="$PREPROD_GUID" ;;
            *)
              echo "Unsupported branch $BRANCH_NAME, skipping marker"
              echo "SKIP_MARKER=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [ -z "$ENTITY_GUID" ]; then
            if [ "$ENVIRONMENT" == "production" ]; then
              echo "::error::NEW_RELIC_DEPLOYMENT_ENTITY_GUID is required for production markers"
              exit 1
            fi
            echo "No entity GUID configured for $ENVIRONMENT, skipping marker"
            echo "SKIP_MARKER=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Deployment marker version is empty"
            exit 1
          fi

          {
            echo "ENTITY_GUID=$ENTITY_GUID"
            echo "DESCRIPTION=$DESCRIPTION"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout built commit
        if: steps.set-guid.outputs.SKIP_MARKER != 'true'
        uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Resolve source commit
        id: source
        if: steps.set-guid.outputs.SKIP_MARKER != 'true'
        env:
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          SUBJECT="$(git log -1 --format=%s "$COMMIT_SHA")"
          if [[ "$SUBJECT" =~ ^Build\ changes\ from\ ([0-9a-f]{40})$ ]]; then
            SOURCE_SHA="${BASH_REMATCH[1]}"
          else
            echo "::error::Built commit does not contain a valid source SHA in its subject"
            exit 1
          fi

          {
            echo "sha=$SOURCE_SHA"
            echo "url=$SERVER_URL/dmg-wp-sites/$REPOSITORY_NAME/commit/$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Get current timestamp in milliseconds
        id: timestamp
        if: steps.set-guid.outputs.SKIP_MARKER != 'true'
        run: echo "NOW_MS=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

      - name: Set New Relic deployment marker
        if: steps.set-guid.outputs.SKIP_MARKER != 'true'
        uses: newrelic/deployment-marker-action@b0c0863151aae3c51c37a5a4a7e26a6c92cd5b91 # v2.6.1
        with:
          apiKey: ${{ secrets.NEW_RELIC_API_KEY }}
          region: "US"
          guid: ${{ steps.set-guid.outputs.ENTITY_GUID }}
          version: ${{ steps.set-guid.outputs.VERSION }}
          commit: ${{ steps.source.outputs.sha }}
          deeplink: ${{ steps.source.outputs.url }}
          changelog: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CHANGELOG.md
          description: ${{ steps.set-guid.outputs.DESCRIPTION }}
          user: ${{ github.actor }}
          timestamp: ${{ steps.timestamp.outputs.NOW_MS }}
